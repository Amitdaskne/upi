<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UPI QR | AMIT DAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- QRCodeStyling library -->
  <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 12px 0;
      font-family: "Orbitron", sans-serif;
      background: #000;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    /* grid & scan effects */
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
      background-size: 32px 32px;
      animation: gridMove 10s linear infinite;
      pointer-events: none;
    }

    body:after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 0%, rgba(255, 255, 255, .03) 50%, transparent 100%);
      animation: scan 6s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(32px); }
    }

    @keyframes scan {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }

    /* main wrapper - full height with flex */
    .wrapper {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 900px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* container — scrollable content area with centered input */
    .container {
      flex: 1;
      padding: 20px 28px 20px;
      position: relative;
      background: rgba(8, 8, 8, .92);
      border: 1px solid rgba(255, 255, 255, .12);
      clip-path: polygon(
        0 22px,
        22px 0,
        calc(100% - 22px) 0,
        100% 22px,
        100% calc(100% - 22px),
        calc(100% - 22px) 100%,
        22px 100%,
        0 calc(100% - 22px)
      );
      box-shadow: 0 0 25px rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
      overflow-y: auto;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .container:before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, .08);
      pointer-events: none;
      clip-path: inherit;
    }

    /* header section - now part of centered content */
    .header-section {
      flex-shrink: 0;
      margin-bottom: 16px;
    }

    h2 {
      text-align: center;
      font-size: 34px;
      letter-spacing: 6px;
      font-weight: 900;
    }

    .subtitle {
      text-align: center;
      margin-top: 8px;
      color: #8a8a8a;
      font-size: 13px;
      letter-spacing: 3px;
    }

    /* center section - input with button edge to edge */
    .center-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #formSection {
      width: 100%;
      position: relative;
    }

    /* input + button edge-to-edge */
    .input-group {
      display: flex;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      background: #050505;
      transition: border-color 0.2s;
    }

    .input-group:focus-within {
      border-color: #555;
    }

    .input-group input {
      flex: 1;
      min-width: 0;
      font-family: "Orbitron", sans-serif;
      padding: 20px 20px;
      border: none;
      background: transparent;
      color: #fff;
      outline: none;
      font-size: 18px;
      letter-spacing: 1px;
    }

    .input-group input::placeholder {
      color: #555;
    }

    .input-group .gen-btn {
      flex-shrink: 0;
      font-family: "Orbitron", sans-serif;
      border: none;
      background: #fff;
      color: #000;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      padding: 0 22px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .input-group .gen-btn:active {
      transform: scale(0.94);
      background: #eee;
    }

    .input-group .gen-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* QR section - organized and clean */
    .qr-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0;
      margin-top: 8px;
    }

    #qrcode {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== UNIQUE QR REVEAL ANIMATION (2s) ===== */
    .qr-frame {
      position: relative;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 16px;
      background: #050505;
      transform-origin: center center;
      animation: uniqueReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      will-change: transform, opacity, filter, clip-path;
      backface-visibility: hidden;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      width: auto;
    }

    @keyframes uniqueReveal {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-15deg) translateY(-60px);
        filter: blur(20px) brightness(2);
        clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
      }
      25% {
        opacity: 0.6;
        transform: scale(1.1) rotate(3deg) translateY(10px);
        filter: blur(8px) brightness(1.3);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      50% {
        opacity: 0.9;
        transform: scale(0.95) rotate(-1deg) translateY(-5px);
        filter: blur(2px) brightness(1.05);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      75% {
        opacity: 1;
        transform: scale(1.02) rotate(0.5deg) translateY(2px);
        filter: blur(0px) brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateY(0px);
        filter: blur(0px) brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    }

    .qr-holder {
      display: flex;
      justify-content: center;
      align-items: center;
      line-height: 0;
    }

    .qr-holder canvas,
    .qr-holder svg {
      width: 340px !important;
      height: 340px !important;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: block;
      image-rendering: auto;
    }

    .current-amount {
      margin-top: 14px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 3px;
      opacity: 0;
      animation: fadeInAmount 1.5s ease 0.5s forwards;
      color: #fff;
      font-weight: 500;
      width: 100%;
    }

    @keyframes fadeInAmount {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: #666;
      font-size: 12px;
      letter-spacing: 2px;
      flex-shrink: 0;
      width: 100%;
    }

    /* ===== FIXED BUTTON (hidden, replaced by inline) ===== */
    .button-wrapper {
      display: none; /* hidden, we use inline button */
    }

    /* ===== CUSTOM POPUP ===== */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup {
      background: rgba(8, 8, 8, .96);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 20px;
      padding: 32px 28px 28px;
      max-width: 380px;
      width: 100%;
      clip-path: polygon(
        0 16px,
        16px 0,
        calc(100% - 16px) 0,
        100% 16px,
        100% calc(100% - 16px),
        calc(100% - 16px) 100%,
        16px 100%,
        0 calc(100% - 16px)
      );
      transform: scale(0.8) translateY(30px);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .popup-overlay.active .popup {
      transform: scale(1) translateY(0);
    }

    .popup-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .popup-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 10px;
      color: #fff;
    }

    .popup-message {
      font-size: 14px;
      color: #aaa;
      letter-spacing: 1px;
      line-height: 1.6;
      margin-bottom: 24px;
      font-family: "Orbitron", sans-serif;
    }

    .popup-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 14px 40px;
      border-radius: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      width: 100%;
    }

    .popup-btn:hover {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .popup-btn:active {
      transform: scale(0.92);
    }

    /* "GENERATE ANOTHER QR" - standalone button (shown after generation) */
    .another-wrapper {
      flex-shrink: 0;
      padding: 0 12px 20px;
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      position: sticky;
      bottom: 0;
      background: transparent;
      z-index: 10;
      display: none;
    }

    .another-wrapper button {
      width: 100%;
      font-family: "Orbitron", sans-serif;
      border-radius: 14px;
      padding: 20px;
      border: 1px solid #333;
      background: #141414;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 18px;
      letter-spacing: 2px;
      font-weight: 700;
      position: relative;
      overflow: hidden;
    }

    .another-wrapper button:active {
      transform: scale(0.92);
      transition-duration: 0.1s;
    }

    .another-wrapper button .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }

    /* 20:9 aspect ratio optimization */
    @media (max-aspect-ratio: 20/9) {
      .container {
        padding: 16px 18px 14px;
      }
      h2 { font-size: 26px; letter-spacing: 4px; }
      .subtitle { font-size: 11px; margin-top: 6px; }
      .header-section { margin-bottom: 12px; }
      .input-group input { padding: 16px 16px; font-size: 17px; }
      .input-group .gen-btn { font-size: 12px; padding: 0 16px; }
      .qr-holder canvas,
      .qr-holder svg {
        width: 300px !important;
        height: 300px !important;
        padding: 14px;
      }
      .qr-frame { padding: 10px; }
      .current-amount { font-size: 15px; margin-top: 12px; }
      .footer { font-size: 10px; margin-top: 14px; }
      .another-wrapper button { padding: 16px; font-size: 16px; }
      .another-wrapper { padding: 0 8px 14px; }
      .popup { padding: 28px 24px 24px; }
      .popup-title { font-size: 20px; }
      .popup-message { font-size: 13px; }
    }

    @media (max-width: 380px) {
      .container {
        padding: 12px 12px 10px;
      }
      h2 { font-size: 20px; letter-spacing: 3px; }
      .header-section { margin-bottom: 10px; }
      .qr-holder canvas,
      .qr-holder svg {
        width: 240px !important;
        height: 240px !important;
        padding: 12px;
      }
      .input-group input { padding: 12px; font-size: 15px; }
      .input-group .gen-btn { font-size: 10px; padding: 0 12px; }
      .qr-frame { padding: 8px; }
      .popup { padding: 24px 20px 20px; }
      .popup-title { font-size: 18px; }
      .another-wrapper button { padding: 14px; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="container">

    <!-- Header -->
    <div class="header-section">
      <h2>AMIT DAS</h2>
      <div class="subtitle">SECURE UPI PAYMENT</div>
    </div>

    <!-- Center section: input with edge-to-edge button -->
    <div class="center-section">
      <div id="formSection">
        <div class="input-group">
          <input type="number" id="amount" placeholder="ENTER AMOUNT IN INR">
          <button class="gen-btn" id="mainActionBtn" onclick="handleGenerate(event)">GENERATE QR</button>
        </div>
      </div>
    </div>

    <!-- QR section -->
    <div class="qr-section">
      <div id="qrcode"></div>
      <div class="footer">UPI ID : amitdaskishanganj-8@oksbi</div>
    </div>

  </div>

  <!-- "GENERATE ANOTHER QR" button (hidden initially) -->
  <div class="another-wrapper" id="anotherWrapper">
    <button id="anotherBtn" onclick="resetQR()">GENERATE ANOTHER QR</button>
  </div>
</div>

<!-- ===== CUSTOM POPUP ===== -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup">
    <span class="popup-icon">⚠️</span>
    <div class="popup-title">INVALID AMOUNT</div>
    <div class="popup-message">Please enter a valid amount greater than zero.</div>
    <button class="popup-btn" onclick="closePopup()">UNDERSTOOD</button>
  </div>
</div>

<script>
  let qrInstance = null;
  let currentAmount = '';

  // Ripple effect for buttons
  function createRipple(e, button) {
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const rect = button.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    button.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
  }

  // Handle generate with ripple and validation
  function handleGenerate(e) {
    const btn = document.getElementById('mainActionBtn');
    if (e) createRipple(e, btn);
    
    const amount = document.getElementById('amount').value.trim();
    if (!amount || parseFloat(amount) <= 0) {
      showPopup();
      return;
    }
    generateQR();
  }

  // Custom popup functions
  function showPopup() {
    document.getElementById('popupOverlay').classList.add('active');
  }

  function closePopup() {
    document.getElementById('popupOverlay').classList.remove('active');
  }

  // Close popup on overlay click
  document.getElementById('popupOverlay').addEventListener('click', function(e) {
    if (e.target === this) closePopup();
  });

  function generateQR() {
    const amount = document.getElementById('amount').value.trim();
    currentAmount = amount;

    const upiLink = `upi://pay?pa=amitdaskishanganj-8@oksbi&pn=AMIT%20DAS&am=${amount}&cu=INR`;

    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';

    // Create frame with unique animation
    const frame = document.createElement('div');
    frame.className = 'qr-frame';

    const qrHolder = document.createElement('div');
    qrHolder.className = 'qr-holder';
    frame.appendChild(qrHolder);

    const amountDiv = document.createElement('div');
    amountDiv.className = 'current-amount';
    amountDiv.textContent = `₹${amount}`;
    frame.appendChild(amountDiv);

    qrContainer.appendChild(frame);

    // Better SVG rendering with high quality
    qrInstance = new QRCodeStyling({
      width: 1200,
      height: 1200,
      type: 'svg',
      data: upiLink,
      margin: 4,
      qrOptions: {
        errorCorrectionLevel: 'H'
      },
      backgroundOptions: {
        color: '#ffffff'
      },
      dotsOptions: {
        type: 'extra-rounded',
        color: '#b10020'
      },
      cornersSquareOptions: {
        type: 'extra-rounded',
        color: '#7a0015'
      },
      cornersDotOptions: {
        type: 'dot',
        color: '#b10020'
      },
      imageOptions: {
        hideBackgroundDots: true,
        imageSize: 0.4,
        crossOrigin: 'anonymous',
        margin: 0
      }
    });

    qrInstance.append(qrHolder);

    // Toggle visibility - hide input, show QR and "another" button
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('anotherWrapper').style.display = 'block';
  }

  function resetQR() {
    document.getElementById('amount').value = '';
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('formSection').style.display = 'block';
    document.getElementById('anotherWrapper').style.display = 'none';
    qrInstance = null;
    currentAmount = '';
  }

  // Add ripple to "another" button
  document.getElementById('anotherBtn').addEventListener('click', function(e) {
    createRipple(e, this);
  });
</script>

</body>
</html>
