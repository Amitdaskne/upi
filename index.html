<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI QR | AMIT DAS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- QRCodeStyling library -->
  <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      font-family: "Orbitron", sans-serif;
      background: #000;
      color: #fff;
      position: relative;
    }

    /* grid & scan effects */
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
      background-size: 32px 32px;
      animation: gridMove 10s linear infinite;
    }

    body:after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 0%, rgba(255, 255, 255, .03) 50%, transparent 100%);
      animation: scan 6s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(32px); }
    }

    @keyframes scan {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }

    /* container */
    .container {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      position: relative;
      background: rgba(8, 8, 8, .92);
      border: 1px solid rgba(255, 255, 255, .12);
      clip-path: polygon(
        0 22px,
        22px 0,
        calc(100% - 22px) 0,
        100% 22px,
        100% calc(100% - 22px),
        calc(100% - 22px) 100%,
        22px 100%,
        0 calc(100% - 22px)
      );
      box-shadow: 0 0 25px rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
    }

    .container:before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, .08);
      pointer-events: none;
      clip-path: inherit;
    }

    h2 {
      text-align: center;
      font-size: 32px;
      letter-spacing: 6px;
      font-weight: 900;
    }

    .subtitle {
      text-align: center;
      margin-top: 12px;
      color: #8a8a8a;
      font-size: 12px;
      letter-spacing: 3px;
    }

    #formSection {
      margin-top: 28px;
    }

    input, button {
      width: 100%;
      font-family: "Orbitron", sans-serif;
      border-radius: 14px;
    }

    input {
      padding: 18px;
      border: 1px solid #2a2a2a;
      background: #050505;
      color: #fff;
      outline: none;
    }

    button {
      padding: 16px;
      margin-top: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .generate {
      background: #fff;
      color: #000;
    }

    .another {
      background: #141414;
      color: #fff;
      border: 1px solid #333;
      display: none;
    }

    #qrcode {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    /* ===== UNIQUE QR REVEAL ANIMATION (2s) ===== */
    .qr-frame {
      position: relative;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 22px;
      background: #050505;
      transform-origin: center center;
      animation: uniqueReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      will-change: transform, opacity, filter, clip-path;
      backface-visibility: hidden;
    }

    @keyframes uniqueReveal {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-15deg) translateY(-60px);
        filter: blur(20px) brightness(2);
        clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
      }
      25% {
        opacity: 0.6;
        transform: scale(1.1) rotate(3deg) translateY(10px);
        filter: blur(8px) brightness(1.3);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      50% {
        opacity: 0.9;
        transform: scale(0.95) rotate(-1deg) translateY(-5px);
        filter: blur(2px) brightness(1.05);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      75% {
        opacity: 1;
        transform: scale(1.02) rotate(0.5deg) translateY(2px);
        filter: blur(0px) brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg) translateY(0px);
        filter: blur(0px) brightness(1);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    }

    .qr-holder {
      display: flex;
      justify-content: center;
    }

    .qr-holder canvas,
    .qr-holder svg {
      width: 270px !important;
      height: 270px !important;
      background: #fff;
      padding: 10px;
      border-radius: 12px;
    }

    .current-amount {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 3px;
      opacity: 0;
      animation: fadeInAmount 1.5s ease 0.5s forwards;
    }

    @keyframes fadeInAmount {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>AMIT DAS</h2>
  <div class="subtitle">SECURE UPI PAYMENT</div>

  <div id="formSection">
    <input type="number" id="amount" placeholder="ENTER AMOUNT IN INR">
    <button class="generate" onclick="generateQR()">GENERATE QR</button>
  </div>

  <div id="qrcode"></div>

  <button id="anotherBtn" class="another" onclick="resetQR()">GENERATE ANOTHER QR</button>

  <div class="footer">UPI ID : amitdaskishanganj-8@oksbi</div>

</div>

<script>
  let qrInstance = null;
  let currentAmount = '';

  function generateQR() {
    const amount = document.getElementById('amount').value.trim();
    if (!amount || parseFloat(amount) <= 0) {
      alert('Please enter a valid amount.');
      return;
    }
    currentAmount = amount;

    const upiLink = `upi://pay?pa=amitdaskishanganj-8@oksbi&pn=AMIT%20DAS&am=${amount}&cu=INR`;

    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';

    // Create frame with unique animation
    const frame = document.createElement('div');
    frame.className = 'qr-frame';

    const qrHolder = document.createElement('div');
    qrHolder.className = 'qr-holder';
    frame.appendChild(qrHolder);

    const amountDiv = document.createElement('div');
    amountDiv.className = 'current-amount';
    amountDiv.textContent = `CURRENT AMOUNT : ₹${amount}`;
    frame.appendChild(amountDiv);

    qrContainer.appendChild(frame);

    qrInstance = new QRCodeStyling({
      width: 1200,
      height: 1200,
      type: 'svg',
      data: upiLink,
      margin: 20,
      qrOptions: {
        errorCorrectionLevel: 'H'
      },
      backgroundOptions: {
        color: '#ffffff'
      },
      dotsOptions: {
        type: 'extra-rounded',
        color: '#b10020'
      },
      cornersSquareOptions: {
        type: 'extra-rounded',
        color: '#7a0015'
      },
      cornersDotOptions: {
        type: 'dot',
        color: '#b10020'
      }
    });

    qrInstance.append(qrHolder);

    // Toggle visibility
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('anotherBtn').style.display = 'block';
  }

  function resetQR() {
    document.getElementById('amount').value = '';
    document.getElementById('qrcode').innerHTML = '';
    document.getElementById('formSection').style.display = 'block';
    document.getElementById('anotherBtn').style.display = 'none';
    qrInstance = null;
    currentAmount = '';
  }
</script>

</body>
</html>
